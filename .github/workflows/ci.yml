name: Integració Contínua (CI)

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop", "feature/**"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-check:
    name: Backend - Validació
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Obtenir el codi
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ./backend/requirements.txt

      - name: Instal.lar dependències
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxi i estil (Linting)
        run: |
          python -m compileall -q .
          python -m ruff check .

      - name: Executar tests unitaris del backend
        run: |
          if [ -d api/tests ] || [ -d tests ]; then
            pytest --cov --cov-report=term --junitxml=pytest.xml
          else
            echo "No hi ha tests del backend; s'omet temporalment."
          fi

      - name: Resum dels tests i la cobertura
        if: always()
        run: python ../.github/scripts/backend_summary.py >> "$GITHUB_STEP_SUMMARY"

  frontend-check:
    name: Frontend - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Obtenir el codi
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Instal.lar dependències
        run: npm ci

      - name: Validar estil de codi (Linting)
        run: npm run lint --if-present

      - name: Construir l'aplicació
        run: npm run build

      - name: Executar tests unitaris del frontend
        run: npm test -- src/tests --coverage --reporter=default --reporter=json --outputFile.json=vitest-results.json

      - name: Resum dels tests i la cobertura
        if: always()
        run: node ../.github/scripts/frontend-summary.mjs >> "$GITHUB_STEP_SUMMARY"