name: CI/CD Backend Docker a Azure (Develop)

on:
  push:
    branches: ["develop"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descarregar repositori
        uses: actions/checkout@v4

      - name: Iniciar sessió en Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Construir i pujar imatge Docker a ACR
        run: |
          docker build -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/backend:dev-${{ github.sha }} ./backend
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/backend:dev-${{ github.sha }}

      - name: Desplegar en Azure App Service (Dev)
        id: deploy
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'apptradeub'
          images: '${{ secrets.REGISTRY_LOGIN_SERVER }}/backend:dev-${{ github.sha }}'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_DEV }}

      - name: Smoke test del backend desplegat
        run: |
          url="${{ steps.deploy.outputs.webapp-url }}/api/v1/health"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ]; then echo "Backend OK: $url"; exit 0; fi
            echo "Intent $i: $code. S'espera 10 s..."; sleep 10
          done
          echo "El backend no respon a $url després del desplegament"; exit 1
