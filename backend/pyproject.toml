[tool.ruff.lint]
# Ingesta de dependències a FastAPI (Depends) i captura d'excepcions
ignore = ["B008", "BLE001"]

[tool.pytest.ini_options]
# backend/ al sys.path: main.py fa "from api import users" (imports absoluts)
pythonpath = ["."]
testpaths = ["api/tests"]

[tool.coverage.run]
# Només el codi de l'aplicació: els tests no compten
source = ["."]
omit = ["api/tests/*", "conftest.py"]
